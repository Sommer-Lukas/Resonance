model:
  model: gru
  hidden_dim: 256
  emotion_dim: 24
  layers: 2
  dropout: 0.15
  causal: false
training:
  epochs: 40
  lr: 0.0005
  batch_size: 1
  seed: 7
  patience: 8
  grad_clip: 1.0
losses:
  geometry: 1.0
  mouth_region_geometry: 0.5
  upper_face_geometry: 0.5
  velocity: 0.25
  acceleration: 0.08
  residual_regularization: 0.0001
